name: Build Rolex Kernel (KSU-Next A11 + BT + GPU Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: 11
          fetch-depth: 0

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev bison flex libelf-dev gcc-arm-linux-gnueabi gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu zip curl
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

      - name: Install KSU-Next Legacy
        run: |
          # Install KSU-Next via official setup script
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

      - name: Patch SusFS (Official Simonpunk)
        run: |
          # Patch Kernel 4.9 & KSU
          curl -LSs "https://gitlab.com/simonpunk/susfs4ksu/-/raw/master/kernel_patches/50_add_susfs_in_kernel-4.9.patch" -o susfs.patch
          if [ -f susfs.patch ]; then
            patch -p1 < susfs.patch || echo "Patch kernel conflict ignored"
          fi
          
          if [ -d "drivers/kernelsu" ]; then
             curl -LSs "https://gitlab.com/simonpunk/susfs4ksu/-/raw/master/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" -o ksu_susfs.patch
             if [ -f ksu_susfs.patch ]; then
                patch -p1 < ksu_susfs.patch || echo "Patch KSU conflict ignored"
             fi
          fi

      - name: Update Defconfig
        run: |
          CONF="arch/arm64/configs/rolex_defconfig"
          
          # Bersihkan sisa config lama
          sed -i '/CONFIG_KSU/d' $CONF
          sed -i '/CONFIG_KPROBES/d' $CONF
          sed -i '/CONFIG_KSU_SUSFS/d' $CONF
          
          # Masukkan konfigurasi target (KSU-Next + SusFS)
          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_KPROBES=y"
            echo "CONFIG_KPROBE_EVENTS=y"
            echo "CONFIG_KSU_KPROBE_HOOKS=y"
            echo "CONFIG_KSU_MANUAL_HOOK=y"
            echo "CONFIG_MODULES=y"
            echo "CONFIG_KALLSYMS=y"
            echo "CONFIG_KALLSYMS_ALL=y"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SUSPEND_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y"
          } >> $CONF

      - name: Compile Kernel (All-in-One Fix)
        run: |
          # 1. JAMU KSU: Bypass proteksi Kbuild
          if [ -f "drivers/kernelsu/Kbuild" ]; then
            echo "Bypassing KSU-Next Hook Check..."
            cp drivers/kernelsu/Kbuild drivers/kernelsu/Kbuild.bak
            grep -v "No hooks were defined" drivers/kernelsu/Kbuild.bak > drivers/kernelsu/Kbuild
            sed -i '1i ccflags-y += -DCONFIG_KSU_MANUAL_HOOK' drivers/kernelsu/Kbuild
          fi

          # 2. JAMU BLUETOOTH: Fix btfm_slim.h missing
          if [ -f "drivers/bluetooth/Makefile" ]; then
            echo "Fixing Bluetooth Header Path..."
            sed -i '1i ccflags-y += -I$(srctree)/drivers/bluetooth' drivers/bluetooth/Makefile
          fi

          # 3. JAMU GPU: Fix kgsl_trace.h missing
          if [ -f "drivers/gpu/msm/Makefile" ]; then
            echo "Fixing GPU Trace Header Path..."
            sed -i '1i ccflags-y += -I$(srctree)/drivers/gpu/msm' drivers/gpu/msm/Makefile
          fi

          # 4. Eksekusi Build Sequence
          make clean
          make rolex_defconfig
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> .config
          make olddefconfig
          
          # 5. Kompilasi dengan pengabaian warning ketat agar tidak stop
          make -j$(nproc) KCFLAGS="-Wno-error -Wno-misleading-indentation -Wno-maybe-uninitialized -Wno-duplicate-decl-specifier"

      - name: Packaging AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          sed -i 's|block=.*|block=/dev/block/bootdevice/by-name/boot;|' AnyKernel3/anykernel.sh
          sed -i 's|is_slot_device=.*|is_slot_device=0;|' AnyKernel3/anykernel.sh
          
          # Ambil hasil kompilasi
          if [ -f "arch/arm64/boot/Image.gz-dtb" ]; then
            cp arch/arm64/boot/Image.gz-dtb AnyKernel3/
          else
            cp arch/arm64/boot/Image.gz AnyKernel3/
          fi
          
          cd AnyKernel3
          zip -r9 ../Kernel-Rolex-A11-KSU-Next-Fix.zip * -x .git README.md

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rolex-A11-KSU-Next-SusFS
          path: Kernel-Rolex-A11-KSU-Next-Fix.zip
