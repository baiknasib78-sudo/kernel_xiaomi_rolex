name: Build Rolex Kernel (KSU-Next A11 Bypass Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: 11
          fetch-depth: 0

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev bison flex libelf-dev gcc-arm-linux-gnueabi gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu zip curl
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

      - name: Install KSU-Next Legacy
        run: |
          # Install KSU-Next via official setup script
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

      - name: Pre-Build Jamu (Bypass KSU Protection)
        run: |
          KSU_DIR=$(find drivers -maxdepth 1 -type d -name "kernelsu*" | head -n 1)
          echo "KSU Folder ditemukan di: $KSU_DIR"
          
          if [ -f "$KSU_DIR/Kbuild" ]; then
            echo "Menghapus proteksi 'No hooks defined' agar tidak Stop..."
            # Hapus baris yang mengandung perintah error/stop agar make clean lancar
            sed -i '/No hooks were defined/d' $KSU_DIR/Kbuild
            sed -i '/integrate manual hooks/d' $KSU_DIR/Kbuild
            # Suntik flag manual hook di baris paling atas
            sed -i '1i ccflags-y += -DCONFIG_KSU_MANUAL_HOOK' $KSU_DIR/Kbuild
          fi

      - name: Apply Manual Hooking (Status Fix)
        run: |
          KSU_DIR=$(find drivers -maxdepth 1 -type d -name "kernelsu*" | head -n 1)
          
          # Patch fs/open.c - Suntik include dan fungsi hook
          sed -i "/#include <linux\/string.h>/a #include <../$KSU_DIR/hooks.h>" fs/open.c
          sed -i '/return error;/i \	ksu_handle_fchmodat(dfd, filename, mode);' fs/open.c
          
          # Patch fs/read_write.c - Suntik vfs read/write
          sed -i "/#include <linux\/slab.h>/a #include <../$KSU_DIR/hooks.h>" fs/read_write.c
          sed -i '/if (ret > 0)/i \	ksu_handle_vfs_read(file, buf, count, pos);' fs/read_write.c
          sed -i '/if (ret > 0)/i \	ksu_handle_vfs_write(file, buf, count, pos);' fs/read_write.c

      - name: Patch SusFS (Official Simonpunk)
        run: |
          curl -LSs "https://gitlab.com/simonpunk/susfs4ksu/-/raw/master/kernel_patches/50_add_susfs_in_kernel-4.9.patch" -o susfs.patch
          [ -f susfs.patch ] && patch -p1 < susfs.patch || echo "Patch kernel skipped"
          
          KSU_DIR=$(find drivers -maxdepth 1 -type d -name "kernelsu*" | head -n 1)
          if [ -d "$KSU_DIR" ]; then
             curl -LSs "https://gitlab.com/simonpunk/susfs4ksu/-/raw/master/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" -o ksu_susfs.patch
             [ -f ksu_susfs.patch ] && patch -p1 < ksu_susfs.patch || echo "Patch KSU skipped"
          fi

      - name: Update Defconfig
        run: |
          CONF="arch/arm64/configs/rolex_defconfig"
          sed -i '/CONFIG_KSU/d' $CONF
          sed -i '/CONFIG_KPROBES/d' $CONF
          sed -i '/CONFIG_KSU_SUSFS/d' $CONF
          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_KPROBES=y"
            echo "CONFIG_KPROBE_EVENTS=y"
            echo "CONFIG_KSU_KPROBE_HOOKS=y"
            echo "CONFIG_KSU_MANUAL_HOOK=y"
            echo "CONFIG_MODULES=y"
            echo "CONFIG_KALLSYMS=y"
            echo "CONFIG_KALLSYMS_ALL=y"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SUSPEND_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y"
          } >> $CONF

      - name: Compile Kernel
        run: |
          KSU_DIR=$(find drivers -maxdepth 1 -type d -name "kernelsu*" | head -n 1)
          
          # Fix Bluetooth & GPU
          find drivers/bluetooth -name "Makefile" -exec sed -i '1i ccflags-y += -I$(srctree)/drivers/bluetooth' {} +
          find drivers/gpu/msm -name "Makefile" -exec sed -i '1i ccflags-y += -I$(srctree)/drivers/gpu/msm -I$(srctree)/drivers/gpu/msm/adreno' {} +
          find drivers/gpu/msm -name "kgsl_trace.h" -exec sed -i 's|#define TRACE_INCLUDE_PATH .|#define TRACE_INCLUDE_PATH ../../drivers/gpu/msm|g' {} +

          # Jalankan Build
          make clean
          make rolex_defconfig
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> .config
          make olddefconfig
          
          # Kompilasi dengan KCFLAGS global
          make -j$(nproc) KCFLAGS="-I$(srctree)/$KSU_DIR -I$(srctree)/drivers/gpu/msm -I$(srctree)/drivers/gpu/msm/adreno -Wno-error -Wno-misleading-indentation -Wno-maybe-uninitialized -Wno-duplicate-decl-specifier"

      - name: Packaging AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          sed -i 's|block=.*|block=/dev/block/bootdevice/by-name/boot;|' AnyKernel3/anykernel.sh
          sed -i 's|is_slot_device=.*|is_slot_device=0;|' AnyKernel3/anykernel.sh
          cp arch/arm64/boot/Image.gz-dtb AnyKernel3/ || cp arch/arm64/boot/Image.gz AnyKernel3/
          cd AnyKernel3
          zip -r9 ../Kernel-Rolex-A11-KSU-Next-Final.zip * -x .git README.md

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rolex-A11-KSU-Next-Final
          path: Kernel-Rolex-A11-KSU-Next-Final.zip
