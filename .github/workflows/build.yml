name: Build Rolex Kernel (KSU-Next + SusFS + Manual Hook Final)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: 11
          fetch-depth: 0

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev bison flex libelf-dev gcc-arm-linux-gnueabi gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu zip curl
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

      - name: 1. Install KSU-Next & Set Path
        run: |
          # Install KSU Legacy
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          
          # Kita pakai path statis yang pasti dibuat oleh script setup.sh
          KSU_PATH="drivers/kernelsu"
          echo "KSU_DIR=$KSU_PATH" >> $GITHUB_ENV
          echo "Path KSU diset ke: $KSU_PATH"

      - name: 2. Patch SusFS (Official Simonpunk)
        run: |
          # Download Patch untuk Kernel 4.9
          curl -LSs "https://gitlab.com/simonpunk/susfs4ksu/-/raw/master/kernel_patches/50_add_susfs_in_kernel-4.9.patch" -o susfs.patch
          patch -p1 < susfs.patch || echo "SusFS Kernel Patch Failed"
          
          # Patch KSU agar menu SusFS muncul
          curl -LSs "https://gitlab.com/simonpunk/susfs4ksu/-/raw/master/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" -o ksu_susfs.patch
          patch -p1 < ksu_susfs.patch || echo "SusFS KSU Patch Failed"

      - name: 3. Bypass KSU Protection & Apply Manual Hook
        run: |
          KSU_DIR="${{ env.KSU_DIR }}"
          
          # Hapus proteksi yang bikin Stop
          if [ -f "$KSU_DIR/Kbuild" ]; then
            sed -i '/No hooks were defined/d' "$KSU_DIR/Kbuild"
            sed -i '/integrate manual hooks/d' "$KSU_DIR/Kbuild"
            sed -i '/\$(error/d' "$KSU_DIR/Kbuild"
            echo "ccflags-y += -DCONFIG_KSU_MANUAL_HOOK" >> "$KSU_DIR/Kbuild"
          fi

          # Manual Hooking (Agar Status Hijau / Working)
          # fs/open.c
          sed -i "/#include <linux\/string.h>/a #include <../$KSU_DIR/hooks.h>" fs/open.c
          sed -i '/return error;/i \	ksu_handle_fchmodat(dfd, filename, mode);' fs/open.c
          
          # fs/read_write.c
          sed -i "/#include <linux\/slab.h>/a #include <../$KSU_DIR/hooks.h>" fs/read_write.c
          sed -i '/if (ret > 0)/i \	ksu_handle_vfs_read(file, buf, count, pos);' fs/read_write.c
          sed -i '/if (ret > 0)/i \	ksu_handle_vfs_write(file, buf, count, pos);' fs/read_write.c

      - name: 4. Update Defconfig
        run: |
          CONF="arch/arm64/configs/rolex_defconfig"
          sed -i '/CONFIG_KSU/d' $CONF
          sed -i '/CONFIG_KPROBES/d' $CONF
          sed -i '/CONFIG_KSU_SUSFS/d' $CONF
          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_KPROBES=y"
            echo "CONFIG_KPROBE_EVENTS=y"
            echo "CONFIG_KSU_MANUAL_HOOK=y"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SUSPEND_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y"
          } >> $CONF

      - name: 5. Compile Kernel
        run: |
          KSU_DIR="${{ env.KSU_DIR }}"
          
          # Fix Header GPU & Bluetooth
          find drivers/gpu/msm -name "Makefile" -exec sed -i '1i ccflags-y += -I$(srctree)/drivers/gpu/msm -I$(srctree)/drivers/gpu/msm/adreno' {} +
          find drivers/gpu/msm -name "kgsl_trace.h" -exec sed -i 's|#define TRACE_INCLUDE_PATH .|#define TRACE_INCLUDE_PATH ../../drivers/gpu/msm|g' {} +

          make clean
          make rolex_defconfig
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> .config
          make olddefconfig
          
          # Compile dengan KCFLAGS untuk include KSU
          make -j$(nproc) KCFLAGS="-I$(srctree)/$KSU_DIR -I$(srctree)/drivers/gpu/msm -I$(srctree)/drivers/gpu/msm/adreno -Wno-error"

      - name: 6. Packaging AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          sed -i 's|block=.*|block=/dev/block/bootdevice/by-name/boot;|' AnyKernel3/anykernel.sh
          cp arch/arm64/boot/Image.gz-dtb AnyKernel3/ || cp arch/arm64/boot/Image.gz AnyKernel3/
          cd AnyKernel3
          zip -r9 ../Kernel-Rolex-A11-KSU-SusFS-Final.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rolex-KSU-Next-SusFS
          path: Kernel-Rolex-A11-KSU-SusFS-Final.zip
